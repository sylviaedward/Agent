[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-research-agent"
version = "0.1.0"
description = "A controlled agent for reproducible stochastic-computing research tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2,<1"]
api = ["uvicorn>=0.30,<1", "fastapi>=0.115,<1"]
ui = ["streamlit>=1.38,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
sc-agent = "sc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
